COM_SERVICEDESKPLUS="ServiceDesk Plus"
COM_SERVICEDESKPLUS_XML_DESCRIPTION="Lets Joomla users create and view their ServiceDesk Plus requests, view loan assets and decide approvals."

COM_SERVICEDESKPLUS_ACCESS_REQUEST_CREATE="Create requests"
COM_SERVICEDESKPLUS_ACCESS_REQUEST_CREATE_DESC="Allows users in this group to create ServiceDesk Plus requests as themselves."
COM_SERVICEDESKPLUS_ACCESS_REQUEST_VIEW="View own requests"
COM_SERVICEDESKPLUS_ACCESS_REQUEST_VIEW_DESC="Allows users in this group to view requests where they are the requester."
COM_SERVICEDESKPLUS_ACCESS_ASSET_VIEW="View own loan assets"
COM_SERVICEDESKPLUS_ACCESS_ASSET_VIEW_DESC="Allows users in this group to view loan assets assigned to them."
COM_SERVICEDESKPLUS_ACCESS_APPROVAL_VIEW="View own approvals"
COM_SERVICEDESKPLUS_ACCESS_APPROVAL_VIEW_DESC="Allows users in this group to view approvals assigned to them."
COM_SERVICEDESKPLUS_ACCESS_APPROVAL_DECIDE="Approve or reject"
COM_SERVICEDESKPLUS_ACCESS_APPROVAL_DECIDE_DESC="Allows users in this group to approve or reject approvals assigned to them in ServiceDesk Plus. Decisions are sent with the service technician key; the user's name is added to the SDP comment."

